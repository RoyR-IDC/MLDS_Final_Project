general:
  part: part1
  config_name: part1_baselines
  device: auto
  seeds: [0]
  deterministic: false

input_output:
  data_dir: data/dogs-vs-cats/train
  results_dir: outputs/results
  figures_dir: outputs/figures

data:
  sample_limit: 256
  val_fraction: 0.2
  test_fraction: 0.0
  image_size: 224
  batch_size: 16
  num_workers: 2

models:
  num_classes: 2
  model_names:
    - resnet18
    - swin_t
    - convmixer
  pretrained: false
  convmixer_dim: 128
  convmixer_depth: 4

experiment:
  grid_sizes: [1, 2, 3, 4]
  num_permutations: 2
  permutation_seed: 42
  epochs: 1
  learning_rate: 0.0003
  optimizer: adamw
  weight_decay: 0.0001
  use_amp: false

