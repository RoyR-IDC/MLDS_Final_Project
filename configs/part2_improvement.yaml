general:
  part: part2
  config_name: part2_improvement
  device: auto
  seed: 42
  deterministic: false

input_output:
  data_dir: data/dogs-vs-cats/train
  results_dir: outputs/results
  figures_dir: outputs/figures

data:
  sample_limit: 256
  val_fraction: 0.2
  test_fraction: 0.0
  image_size: 224
  batch_size: 16
  num_workers: 2

models:
  num_classes: 2
  model_name: resnet18

experiment:
  grid_sizes: [2, 3, 4]
  num_permutations: 2
  train_permutation_pool_size: 6
  epochs: 1
  learning_rate: 0.0003
  optimizer: adamw
  weight_decay: 0.0001
  use_amp: false

ablations:
  - name: baseline
    use_pretrained: false
    use_standard_augmentation: false
    use_permutation_augmentation: false
    freeze_backbone: false
  - name: augmentation_only
    use_pretrained: false
    use_standard_augmentation: true
    use_permutation_augmentation: false
    freeze_backbone: false
  - name: permutation_augmentation_only
    use_pretrained: false
    use_standard_augmentation: false
    use_permutation_augmentation: true
    freeze_backbone: false
  - name: full_improved
    use_pretrained: true
    use_standard_augmentation: true
    use_permutation_augmentation: true
    freeze_backbone: false
